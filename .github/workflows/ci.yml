name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: beehome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d beehome_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beehome_test?schema=public
      JWT_SECRET: ci-secret
      ADMIN_API_KEY: ci-admin-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Tests
        run: npm run test

      - name: Generate OpenAPI
        run: npm run openapi:generate

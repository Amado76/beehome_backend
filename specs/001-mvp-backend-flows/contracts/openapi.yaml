openapi: 3.0.3
info:
  title: BeeHome Planner API (MVP)
  version: 0.1.0
  description: |
    MVP backend API for BeeHome Planner core flows. This contract is a planning artifact.
    Runtime validation and docs must be generated from Zod schemas in implementation.
servers:
  - url: http://localhost:3000

tags:
  - name: Auth
  - name: Families
  - name: Children
  - name: Subjects
  - name: Lessons
  - name: Schedules
  - name: Executions
  - name: Projects
  - name: Reports
  - name: Dashboard
  - name: License
  - name: Admin

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up with email+password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email+password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /families:
    post:
      tags: [Families]
      summary: Create a family (starts trial)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamilyRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /children:
    get:
      tags: [Children]
      summary: List children in current family
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChildProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

    post:
      tags: [Children]
      summary: Create a child profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /subjects:
    get:
      tags: [Subjects]
      summary: List subjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

    post:
      tags: [Subjects]
      summary: Create subject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubjectRequest'
      responses:
        '201':
          description: Created
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /lessons:
    post:
      tags: [Lessons]
      summary: Create lesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
      responses:
        '201':
          description: Created
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /schedules:
    post:
      tags: [Schedules]
      summary: Create a schedule (one-time or recurring)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Created
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /schedules/{scheduleId}/exceptions:
    post:
      tags: [Schedules]
      summary: Apply an exception to one occurrence (skip/shift/reschedule)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleExceptionRequest'
      responses:
        '201':
          description: Created
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /executions:
    post:
      tags: [Executions]
      summary: Mark a scheduled occurrence as completed (create execution)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExecutionRequest'
      responses:
        '201':
          description: Created
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard aggregates (allowed even when unlicensed)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reports/learning-history/pdf:
    get:
      tags: [Reports]
      summary: Download learning history report as PDF
      description: |
        Server-side PDF generated from HTML templates (headless Chromium) for web and mobile clients.
        The same report format selector (summary vs visual) applies as for on-screen reports.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: childId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: startDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: endDate
          required: true
          schema: { type: string, format: date }
        - in: query
          name: format
          required: true
          schema:
            type: string
            enum: [summary, visual]
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }

  /license/status:
    get:
      tags: [License]
      summary: Get current family license status + trial end date
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatusResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /billing/checkout:
    post:
      tags: [License]
      summary: Start billing checkout flow (provider-agnostic placeholder)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/families/{familyId}/license:
    get:
      tags: [Admin]
      summary: Admin get family license
      security:
        - adminAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyLicense'
        '401': { $ref: '#/components/responses/Unauthorized' }

    put:
      tags: [Admin]
      summary: Admin set/override family license
      security:
        - adminAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateFamilyLicenseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyLicense'
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: apiKey
      in: header
      name: X-Admin-Key

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: License required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
      required: [error]

    SignUpRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
      required: [accessToken]

    CreateFamilyRequest:
      type: object
      properties:
        name: { type: string }

    Family:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      required: [id]

    CreateChildRequest:
      type: object
      properties:
        name: { type: string }
      required: [name]

    ChildProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      required: [id, name]

    CreateSubjectRequest:
      type: object
      properties:
        name: { type: string }
      required: [name]

    CreateLessonRequest:
      type: object
      properties:
        title: { type: string }
        subjectId: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        description: { type: string }
      required: [title]

    CreateScheduleRequest:
      type: object
      properties:
        type:
          type: string
          enum: [LESSON_CLASS, ACTIVITY]
        lessonId: { type: string, format: uuid }
        title: { type: string }
        timezone: { type: string }
        daysOfWeek:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        startTimeLocal: { type: string, description: HH:mm }
        estimatedDuration:
          type: object
          properties:
            value: { type: number, minimum: 0 }
            unit: { type: string, enum: [MINUTES, HOURS] }
          required: [value, unit]
        scoringEnabled: { type: boolean }
        maxPoints: { type: integer, minimum: 0 }
        activityEnvironment:
          type: string
          enum: [INDOOR, OUTDOOR, MIXED]
        childIds:
          type: array
          items: { type: string, format: uuid }
      required: [type, timezone]

    CreateScheduleExceptionRequest:
      type: object
      properties:
        occurrenceStartsAt: { type: string, format: date-time }
        type:
          type: string
          enum: [SKIP, SHIFT_FORWARD, RESCHEDULE]
        newStartsAt: { type: string, format: date-time }
      required: [occurrenceStartsAt, type]

    CreateExecutionRequest:
      type: object
      properties:
        scheduleId: { type: string, format: uuid }
        occurrenceStartsAt: { type: string, format: date-time }
        actualDuration:
          type: object
          properties:
            value: { type: number, minimum: 0 }
            unit: { type: string, enum: [MINUTES, HOURS] }
          required: [value, unit]
        participantChildIds:
          type: array
          items: { type: string, format: uuid }
      required: [scheduleId, occurrenceStartsAt, participantChildIds]

    DashboardResponse:
      type: object
      description: Overview-only aggregates; no lists/ids when unlicensed.
      properties:
        timeWindow:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        totals:
          type: object
          properties:
            completedCount: { type: integer }
            skippedCount: { type: integer }
            minutesSpent: { type: integer }
      required: [totals]

    LicenseStatusResponse:
      type: object
      properties:
        status: { type: string }
        trialEndsAt: { type: string, format: date-time }
      required: [status, trialEndsAt]

    FamilyLicense:
      type: object
      properties:
        familyId: { type: string, format: uuid }
        status: { type: string }
        trialStartsAt: { type: string, format: date-time }
        trialEndsAt: { type: string, format: date-time }
        manualActiveUntil: { type: string, format: date-time }

    AdminUpdateFamilyLicenseRequest:
      type: object
      properties:
        status: { type: string }
        manualActiveUntil: { type: string, format: date-time }
        reason: { type: string }
      required: [status, reason]
